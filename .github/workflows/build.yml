name: Build Thinkpad Assistant

on:
  pull_request:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - 'v*'

permissions:
  contents: read

env:
  APP_NAME: ThinkpadAssistant
  BUILD_DIR: build/Build/Products/Release
  ZIP_NAME: ThinkpadAssistant-macOS.zip
  DMG_NAME: ThinkpadAssistant-macOS.dmg

jobs:
  build:
    # Runner Intel; deployment target 13.0 => hasil build jalan di Ventura ke atas.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Build (Ventura 13.0+, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThinkpadAssistant.xcodeproj \
            -scheme ThinkpadAssistant \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              tail -n 250 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Verify .app
        run: |
          set -euo pipefail
          test -d "${BUILD_DIR}/${APP_NAME}.app"
          codesign --verify --deep --strict "${BUILD_DIR}/${APP_NAME}.app"

      - name: Package (.app → .zip + .dmg)
        run: |
          set -euo pipefail
          cd "${BUILD_DIR}"

          # .zip mempertahankan struktur .app + signature (dipakai Sparkle).
          ditto -c -k --keepParent "${APP_NAME}.app" "${GITHUB_WORKSPACE}/${ZIP_NAME}"

          # .dmg untuk install manual: drag .app ke /Applications.
          rm -rf dmg-staging
          mkdir dmg-staging
          cp -R "${APP_NAME}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Thinkpad Assistant" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "${GITHUB_WORKSPACE}/${DMG_NAME}"

          shasum -a 256 \
            "${GITHUB_WORKSPACE}/${ZIP_NAME}" \
            "${GITHUB_WORKSPACE}/${DMG_NAME}" \
            > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"

      - name: Upload artifacts (.app.zip + .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ThinkpadAssistant-macOS
          path: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/${{ env.DMG_NAME }}
            ${{ github.workspace }}/SHA256SUMS.txt
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3
