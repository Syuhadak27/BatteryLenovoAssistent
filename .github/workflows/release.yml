name: Release Thinkpad Assistant

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: ThinkpadAssistant
  BUILD_DIR: build/Build/Products/Release
  SPARKLE_VERSION: "2.10.1"

jobs:
  release:
    # Runner Intel; deployment target 13.0 => binary jalan di Ventura ke atas.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (Ventura 13.0+, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThinkpadAssistant.xcodeproj \
            -scheme ThinkpadAssistant \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -quiet \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='x86_64 arm64' 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## xcodebuild failed (exit $status)"
              echo '```'
              tail -n 250 xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3

      - name: Verify .app + baca versi
        id: version
        run: |
          set -euo pipefail
          APP="${BUILD_DIR}/${APP_NAME}.app"
          test -d "${APP}"
          codesign --verify --deep --strict "${APP}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Contents/Info.plist")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${APP_NAME}-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${APP_NAME}-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "### Build ${VERSION} (${BUILD_NUMBER})" >> "$GITHUB_STEP_SUMMARY"

      - name: Package (.app → .zip + .dmg)
        id: package
        run: |
          set -euo pipefail
          cd "${BUILD_DIR}"

          ZIP_NAME="${APP_NAME}-${{ steps.version.outputs.version }}.zip"
          DMG_NAME="${APP_NAME}-${{ steps.version.outputs.version }}.dmg"

          ditto -c -k --keepParent "${APP_NAME}.app" "${GITHUB_WORKSPACE}/${ZIP_NAME}"

          rm -rf dmg-staging
          mkdir dmg-staging
          cp -R "${APP_NAME}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Thinkpad Assistant" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "${GITHUB_WORKSPACE}/${DMG_NAME}"

          shasum -a 256 "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${GITHUB_WORKSPACE}/${DMG_NAME}" \
            > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"

          echo "zip=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "dmg=${GITHUB_WORKSPACE}/${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sums=${GITHUB_WORKSPACE}/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThinkpadAssistant-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.sums }}
          retention-days: 90

      - name: Siapkan sign_update + tanda tangani zip (Sparkle Ed25519)
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::GitHub Secret SPARKLE_PRIVATE_KEY belum diset." >&2
            exit 1
          fi

          CACHE_DIR="${RUNNER_TEMP}/sparkle-${SPARKLE_VERSION}"
          mkdir -p "${CACHE_DIR}"
          curl --fail --location --retry 3 --silent --show-error \
            -o "${CACHE_DIR}/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xJf "${CACHE_DIR}/Sparkle.tar.xz" -C "${CACHE_DIR}" bin/sign_update
          chmod +x "${CACHE_DIR}/bin/sign_update"

          # Key lewat stdin (--ed-key-file -): tidak pernah ditulis ke disk / ps.
          # Format exported key = 1 baris base64 (sesuai generate_keys -x).
          SIGNATURE="$(printf '%s' "${SPARKLE_PRIVATE_KEY}" | \
            "${CACHE_DIR}/bin/sign_update" --ed-key-file - -p "${ZIP_PATH}")"
          LENGTH="$(stat -f%z "${ZIP_PATH}")"

          echo "signature=${SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "length=${LENGTH}" >> "$GITHUB_OUTPUT"
          echo "### Sparkle signature" >> "$GITHUB_STEP_SUMMARY"
          echo "- length: ${LENGTH}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET

          ns = {
              'sparkle': 'http://www.andymatuschak.org/xml-namespaces/sparkle',
              'dc': 'http://purl.org/dc/elements/1.1/',
          }
          ET.register_namespace('sparkle', ns['sparkle'])
          ET.register_namespace('dc', ns['dc'])

          version = os.environ['VERSION']
          build = os.environ['BUILD_NUMBER']
          signature = os.environ['SIGNATURE']
          length = os.environ['LENGTH']

          tree = ET.parse('appcast.xml')
          root = tree.getroot()
          channel = root.find('channel')

          # Hapus item lama dengan versi yang sama (idempotent).
          for item in list(channel.findall('item')):
              enc = item.find('enclosure')
              if enc is not None and enc.get('{http://www.andymatuschak.org/xml-namespaces/sparkle}version') == build:
                  channel.remove(item)

          item = ET.Element('item')
          ET.SubElement(item, 'title').text = f'Version {version}'
          ET.SubElement(item, 'pubDate').text = os.popen(
              'date -u "+%a, %d %b %Y %H:%M:%S +0000"'
          ).read().strip()
          ET.SubElement(item, 'enclosure', {
              'url': f'https://github.com/Syuhadak27/BatteryLenovoAssistent/releases/download/v{version}/ThinkpadAssistant-{version}.zip',
              '{http://www.andymatuschak.org/xml-namespaces/sparkle}version': build,
              '{http://www.andymatuschak.org/xml-namespaces/sparkle}shortVersionString': version,
              '{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature': signature,
              'type': 'application/octet-stream',
              'length': length,
          })
          channel.insert(0, item)

          tree.write('appcast.xml', encoding='utf-8', xml_declaration=True)
          print(f'Updated appcast.xml -> {version} (build {build})')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- appcast.xml; then
            git add appcast.xml
            git commit -m "chore: update appcast.xml for v${VERSION} [skip ci]"
            git push origin HEAD:main
          else
            echo "appcast.xml sudah up to date, tidak ada commit."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Thinkpad Assistant v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install (macOS Ventura 13+)
            1. Unduh **`${{ steps.version.outputs.dmg_name }}`**, buka, drag *Thinkpad Assistant.app* ke **Applications**.
            2. Karena binary ad-hoc signed (tanpa notarisasi), jalankan sekali:
               ```bash
               xattr -cr /Applications/ThinkpadAssistant.app
               ```
            3. Jalankan aplikasi → menu bar → **Battery Threshold**.

            Alternatif: **`${{ steps.version.outputs.zip_name }}`** berisi `.app` yang sama (dipakai Sparkle).
            Cek hash di `SHA256SUMS.txt`.
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.sums }}
